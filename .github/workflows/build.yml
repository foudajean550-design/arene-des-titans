name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y freeglut3-dev libglu1-mesa-dev
      - name: Configuration
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilation
        run: cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuration
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilation
        run: cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure
